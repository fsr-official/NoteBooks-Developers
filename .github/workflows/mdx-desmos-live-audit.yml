name: Live Desmos Render Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build HTML in a temporary directory
        run: pnpm exec tsx utils/build-html.ts "--out-dir=$RUNNER_TEMP/mdx-desmos-audit"

      - name: Run live Desmos render audit
        env:
          DESMOS_API_KEY: ${{ secrets.DESMOS_API_KEY }}
          DESMOS_AUDIT_ORIGIN: https://notebooks-framework.vercel.app
        run: pnpm exec tsx utils/audit-desmos.ts "--out-dir=$RUNNER_TEMP/mdx-desmos-audit"
